<!DOCTYPE html>
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./assets/images/logo.png">
    <link rel= "stylesheet" href= "assets/css/index.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
          }
        }
    </script>        
    <title>FPV online</title>

    <!-- Open Graph / Meta Tags for Social Sharing -->
    <meta property="og:title" content="FPV-ONLINE — Web-Based FPV Drone Simulator" />
    <meta property="og:description" content="Fly FPV drones right in your browser. No install needed. Made by Ukrainian developers." />
    <meta property="og:image" content="https://vvriter.github.io/FPV-ONLINE/assets/images/logo.png" />
    <meta property="og:url" content="https://vvriter.github.io/FPV-ONLINE/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card (optional but recommended) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FPV-ONLINE — Web-Based FPV Drone Simulator" />
    <meta name="twitter:description" content="Fly FPV drones right in your browser. No install needed. Made by Ukrainian developers." />
    <meta name="twitter:image" content="https://vvriter.github.io/FPV-ONLINE/assets/images/logo.png" />
</head>
<body>
    <canvas id="threeCanvas"></canvas>
    <canvas id="interface"></canvas>
    <div id="map-switcher" aria-label="地图难度">
        <button type="button" class="map-button active" data-map="easy">简单地图</button>
        <button type="button" class="map-button" data-map="hard">困难地图</button>
    </div>
    <div id="race-hud" hidden>
        <span id="gate-progress">穿门 0 / 8</span>
        <span id="race-time">等待开始 — 推油门或拨动摇杆</span>
    </div>
    <div id="race-result" hidden>
        <p class="result-title">赛道完成！</p>
        <p id="final-time">00:00.00</p>
        <button type="button" id="restart-race">再来一次</button>
    </div>
    <div class="gamepad-info">
        <p id="info">未连接手柄 — 键盘操控：W/S 油门 · A/D 偏航 · ↑/↓ 俯仰 · ←/→ 横滚</p>
        <canvas id="canvas" width="300" height="150"></canvas>
    </div>
    <script src="src/engine.js" type="module"></script>
    <script src="src/gamepad.js"></script>
</body>
</html>
